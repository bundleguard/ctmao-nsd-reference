[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "ctmao-nsd-reference"
version = "0.2.0"
description = "Experimental multi-agent runtime and local execution-observability reference"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "CTMAO-NSD contributors"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = []

[project.urls]
Repository = "https://github.com/bundleguard/ctmao-nsd-reference"
Issues = "https://github.com/bundleguard/ctmao-nsd-reference/issues"
Documentation = "https://github.com/bundleguard/ctmao-nsd-reference#readme"

[tool.setuptools.packages.find]
where = ["src"]

[tool.coverage.run]
branch = true
source = ["ctmao_nsd"]
